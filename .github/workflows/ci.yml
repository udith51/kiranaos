name: KiranaOS CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  # ─────────────────────────────────────────
  # JOB 1 — Build + Test all modules
  # ─────────────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build & Test (All modules)
        run: mvn clean verify -B

      - name: Upload target directories
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            kiranaos-discovery/target/
            kiranaos-gateway/target/
            kiranaos-auth-service/target/
            kiranaos-store-service/target/
            kiranaos-billing-service/target/
            kiranaos-analytics-service/target/

  # ─────────────────────────────────────────
  # JOB 2 — Sonar per service independently
  # ─────────────────────────────────────────
  sonar:
    name: SonarCloud — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    strategy:
      matrix:
        service:
          - kiranaos-discovery
          - kiranaos-gateway
          - kiranaos-auth-service
#          - kiranaos-store-service
#          - kiranaos-billing-service
#          - kiranaos-analytics-service

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      - name: SonarCloud Analysis — ${{ matrix.service }}
        working-directory: ${{ matrix.service }}
        run: mvn sonar:sonar -Dsonar.login=${{ secrets.SONAR_TOKEN }} -B

