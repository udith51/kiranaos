name: KiranaOS CI

on:
  push:
    branches:
      - 'feature/**'
      - dev
      - main
    paths:
      - 'kiranaos-discovery/**'
      - 'kiranaos-gateway/**'
      - '.github/workflows/**'

jobs:

  # ─────────────────────────────────────────
  # JOB 1 — runs on every push to feature/**, dev, main
  # ─────────────────────────────────────────
  build-and-test:
    name: Build, Checkstyle & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build & Test — Discovery
        working-directory: kiranaos-discovery
        run: mvn verify -B

      - name: Build & Test — Gateway
        working-directory: kiranaos-gateway
        run: mvn verify -B

      - name: Upload Coverage Reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            kiranaos-discovery/target/site/jacoco/
            kiranaos-gateway/target/site/jacoco/

  # ─────────────────────────────────────────
  # JOB 2 — only runs on push to main
  # SonarCloud free tier only analyses main
  # ─────────────────────────────────────────
  sonar-and-owasp:
    name: SonarCloud & OWASP
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: SonarCloud — Discovery
        working-directory: kiranaos-discovery
        run: mvn verify sonar:sonar -B
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarCloud — Gateway
        working-directory: kiranaos-gateway
        run: mvn verify sonar:sonar -B
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: OWASP Dependency Check — Discovery
        working-directory: kiranaos-discovery
        run: mvn dependency-check:check -B

      - name: OWASP Dependency Check — Gateway
        working-directory: kiranaos-gateway
        run: mvn dependency-check:check -B

