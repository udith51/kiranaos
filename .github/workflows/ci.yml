name: KiranaOS CI

on:
  push:
    branches:
      - '**'   # all branches
    paths:
      - 'pom.xml'
      - 'kiranaos-discovery/**'
      - 'kiranaos-gateway/**'
      - '.github/workflows/**'

  pull_request:
    branches:
      - main
    paths:
      - 'pom.xml'
      - 'kiranaos-discovery/**'
      - 'kiranaos-gateway/**'
      - '.github/workflows/**'

jobs:

  # ─────────────────────────────────────────
  # JOB 1 — Runs on ALL commits + PR + main
  # ─────────────────────────────────────────
  build-and-test:
    name: Build, Checkstyle & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build & Test (All modules)
        run: mvn clean verify -B

      - name: Upload Coverage Reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            kiranaos-discovery/target/site/jacoco/
            kiranaos-gateway/target/site/jacoco/

  # ─────────────────────────────────────────
  # JOB 2 — Runs ONLY on PR to main + push to main
  # ─────────────────────────────────────────
  sonar:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: build-and-test
#    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: SonarCloud Analysis (Root)
        run: mvn verify sonar:sonar -Dsonar.login=${{ secrets.SONAR_TOKEN }} -B

  # ─────────────────────────────────────────
  # JOB 3 — Runs ONLY on PR to main + push to main
  # ─────────────────────────────────────────
  owasp:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    needs: sonar
#    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: OWASP Dependency Check
        run: mvn dependency-check:check -Dnvd.apiKey=${{ secrets.NVD_API_KEY }} -B

